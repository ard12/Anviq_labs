name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema hypothesis ruff
          for p in q1_lru_ttl q2_semantic_cache q3_tool_harness q4_trust_layer/control; do
            if [ -f "$p/pyproject.toml" ]; then pip install -e "$p[dev]"; fi
          done
      - name: Lint
        run: ruff check .
      - name: Test
        run: python tasks.py test
      - name: Verify installed wheel resources
        run: |
          pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" ./q1_lru_ttl ./q2_semantic_cache ./q3_tool_harness ./q4_trust_layer/control
          pip install --no-deps --target "$RUNNER_TEMP/installed" "$RUNNER_TEMP"/wheels/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/installed" python -c "from lru_ttl import LRUTTLCache; from semantic_cache import SemanticCache; from harness.recording import _validator; from control.policy import PolicyTable; _validator(); PolicyTable.default(); print('Installed wheel imports and resources OK')"

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: echo "yes=$([ -f q4_trust_layer/proxy/go.mod ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: q4_trust_layer/proxy/go.mod
      - name: Test (includes golden-vector hash parity with Python)
        if: steps.present.outputs.yes == 'true'
        working-directory: q4_trust_layer/proxy
        run: go test ./...
      - name: Race detector and vet
        if: steps.present.outputs.yes == 'true'
        working-directory: q4_trust_layer/proxy
        run: |
          go test -race ./...
          go vet ./...
      - name: Bench
        if: steps.present.outputs.yes == 'true'
        working-directory: q4_trust_layer/proxy
        run: go test -run '^$' -bench . -benchmem ./...

  # Q3 as a real CI gate: benign drift must pass, rug-pull must fail.
  drift-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: echo "yes=$([ -f q3_tool_harness/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.present.outputs.yes == 'true'
        run: pip install -e q3_tool_harness
      - name: Benign change passes
        if: steps.present.outputs.yes == 'true'
        run: harness check --baseline q3_tool_harness/fixtures/baseline.jsonl --current q3_tool_harness/fixtures/benign.jsonl --fail-on SECURITY,BREAKING
      - name: Rug-pull is caught (expected failure, inverted)
        if: steps.present.outputs.yes == 'true'
        run: |
          set +e
          harness check --baseline q3_tool_harness/fixtures/baseline.jsonl --current q3_tool_harness/fixtures/rugpull.jsonl \
            --fail-on SECURITY,BREAKING --format sarif --output rugpull.sarif
          rc=$?
          set -e
          test "$rc" -eq 1 || { echo "expected exit 1, got $rc"; exit 1; }
      - name: Keep SARIF as an artifact
        if: steps.present.outputs.yes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rugpull-sarif
          path: rugpull.sarif
      # Code scanning needs GitHub Advanced Security on private repos; don't fail the build over it.
      - name: Show findings in code scanning
        if: steps.present.outputs.yes == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: rugpull.sarif
          category: tool-drift-demo
