[project]
name = "harness"
version = "0.1.0"
description = "Q3: record, diff, and CI-gate agent tool-use sessions against 'rug-pull' definition/behaviour drift."
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]
mcp = ["mcp>=1.0"]
embed = ["numpy>=1.26"]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["_schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
